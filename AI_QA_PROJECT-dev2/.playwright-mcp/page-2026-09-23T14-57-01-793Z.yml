        - generic [ref=f10e187]: Getting Started
        - heading "How Your Team Accelerator Starts" [level=2] [ref=f10e188]
        - paragraph [ref=f10e189]: We keep the onboarding process simple and transparent — no course is decided before we understand your project.
      - generic [ref=f10e190]:
        - generic [ref=f10e198]:
          - generic [ref=f10e199]: Step 1
          - heading "Consultation With Rahul Shetty" [level=4] [ref=f10e201]
          - paragraph [ref=f10e202]: Your manager, team lead, or training representative walks Rahul through your QA team structure, existing skill levels, current and planned technologies, timelines, team size, and expected learning outcomes. The goal isn't to recommend courses immediately — it's to understand what success should look like for your team.
        - generic [ref=f10e214]:
          - generic [ref=f10e215]: Step 2
          - heading "Share Your Required Course Outline" [level=4] [ref=f10e217]
          - paragraph [ref=f10e218]: Once there's a good fit, your manager or technical lead shares the training outline or skills needed — from a complete curriculum to something as simple as "move our team from Selenium Java to Playwright TypeScript with API testing and CI/CD integration." Our job is to convert that into a practical learning programme.
        - generic [ref=f10e229]:
          - generic [ref=f10e230]: Step 3
          - heading "We Map Your Requirements Into a Learning Program" [level=4] [ref=f10e232]
          - paragraph [ref=f10e233]: We prepare a proposed roadmap — required modules, sequence, what can be skipped, what needs deeper coverage, exercises, mini-projects, mentor and Rahul review checkpoints, assessments, and expected duration. Your manager gets complete visibility before the programme begins, and we can walk you through the learning platform and mentoring model.
        - generic [ref=f10e247]:
          - generic [ref=f10e248]: Step 4
          - heading "Program Approval & Kickoff" [level=4] [ref=f10e250]
          - paragraph [ref=f10e251]: Once the learning plan, commercials, team size, and timelines are agreed, the engagement begins. Your team gets access to the assigned curriculum and is introduced to the mentor who will support them throughout — we don't just hand over course access, we actively guide the journey.
