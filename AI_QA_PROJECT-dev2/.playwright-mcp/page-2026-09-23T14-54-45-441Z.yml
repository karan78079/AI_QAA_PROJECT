        - generic [ref=f1e192]:
          - paragraph [ref=f1e197]: "Stuck: Finishing tutorials isn't proof you can do the job."
          - heading "Real Projects. Real Deadlines." [level=3] [ref=f1e198]
          - paragraph [ref=f1e199]: From day one of Phase 2, you work on assignments with hard deadlines that mirror actual QA job expectations — the same ownership, pressure, and standards a working automation engineer deals with daily. By the time you're done, your project experience matches someone who's already doing the job, not someone who just studied it.
        - generic [ref=f1e201]:
          - paragraph [ref=f1e206]: "Stuck: You won't know you're not interview-ready until a real interview exposes it — and by then, the opportunity's gone."
          - heading "Interview-Ready. Resume-Ready. Recruiter-Ready." [level=3] [ref=f1e207]
          - paragraph [ref=f1e208]: A 1-hour mock interview with your mentor pinpoints exactly which areas are weak, so you can go back and close those gaps before they cost you a real opportunity. That one precise fix to your resume is often what turns a rejection into a shortlist — recruiter visibility on TechSmartHire follows once you're genuinely ready.
