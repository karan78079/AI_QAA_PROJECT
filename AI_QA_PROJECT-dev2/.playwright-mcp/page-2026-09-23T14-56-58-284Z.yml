          - paragraph [ref=f9e211]: The real conversations happening in the industry — which skills are being phased out, what the bar looks like now, and how to get ahead of it.
        - generic [ref=f9e212]:
          - heading "Career Strategies That Outlast Any Single Tool" [level=3] [ref=f9e216]
